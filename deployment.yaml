apiVersion: apps/v1
kind: Deployment
metadata:
  name: javaapp-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: Javaapp
  template:
    metadata:
      labels:
        app: Javaapp
    spec:
      containers:
      - name: javaapp-container
        image: yaswanth345/javaapp:latest
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: javaapp-service
spec:
  selector:
    app: javaapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort
